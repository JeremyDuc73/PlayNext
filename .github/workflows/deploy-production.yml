name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-production.yml"

permissions:
  contents: read

concurrency:
  group: playnext-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy PlayNext to VPS
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
      VPS_WEB_PATH: ${{ secrets.VPS_WEB_PATH }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build public website
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build -w @playnext/web

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Prepare web directory
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_WEB_PATH'"

      - name: Deploy public website
        run: |
          rsync -az --delete apps/web/dist/ \
            "$VPS_USER@$VPS_HOST:$VPS_WEB_PATH/"

      - name: Update API and restart production container
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            set -e
            git -C '$VPS_APP_PATH' fetch --prune origin main
            git -C '$VPS_APP_PATH' checkout main
            git -C '$VPS_APP_PATH' reset --hard origin/main
            cd '$VPS_APP_PATH'
            docker compose \
              --env-file deploy/.env.production \
              -f deploy/docker-compose.production.yml \
              up -d --build playnext-api
          "

      - name: Smoke test production API
        run: |
          curl --fail --silent --show-error \
            https://api.playnext.jeremyduc.dev/health
