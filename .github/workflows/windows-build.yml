name: Windows build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de release GitHub"
        required: true
        default: "v0.2.0"

jobs:
  build-windows:
    name: NSIS installer
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (NSIS)
        working-directory: apps/desktop
        env:
          VITE_API_URL: https://api.playnext.jeremyduc.dev
        run: npm run tauri:build

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "apps\desktop\src-tauri\target\release\bundle\nsis" `
            -Filter *.exe `
            | Select-Object -First 1
          if (-not $installer) { throw "Installeur NSIS introuvable" }
          Copy-Item $installer.FullName `
            "apps\desktop\src-tauri\target\release\bundle\nsis\PlayNext-Setup.exe" `
            -Force

      - name: Import Windows signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "playnext-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          "PLAYNEXT_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV

      - name: Sign Windows binaries
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            | Sort-Object LastWriteTime -Descending `
            | Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe introuvable" }
          $binaries = Get-ChildItem `
            "apps\desktop\src-tauri\target\release" `
            -Filter *.exe -Recurse
          foreach ($binary in $binaries) {
            & $signTool.FullName sign /fd SHA256 `
              /f $env:PLAYNEXT_CERTIFICATE_PATH `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 `
              $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature échouée: $($binary.FullName)" }
          }

      - name: Sign updater artifact
        working-directory: apps/desktop
        run: |
          npx tauri signer sign `
            "src-tauri\target\release\bundle\nsis\PlayNext-Setup.exe"

      - name: Generate updater manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $nsisDir = "apps\desktop\src-tauri\target\release\bundle\nsis"
          $installer = Join-Path $nsisDir "PlayNext-Setup.exe"
          $signaturePath = "$installer.sig"
          if (-not (Test-Path $installer)) { throw "Installateur introuvable" }
          if (-not (Test-Path $signaturePath)) { throw "Signature updater introuvable" }

          $version = (Get-Content "apps\desktop\src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json).version
          $signature = (Get-Content $signaturePath -Raw).Trim()
          $downloadUrl = "https://github.com/JeremyDuc73/PlayNext/releases/download/$env:RELEASE_TAG/PlayNext-Setup.exe"
          $manifest = @{
            version = $version
            notes = "Mise à jour PlayNext"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                url = $downloadUrl
                signature = $signature
              }
            }
          } | ConvertTo-Json -Depth 5

          Set-Content -Path "$nsisDir\latest.json" -Value $manifest -Encoding utf8

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: playnext-windows-nsis
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/PlayNext-Setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/PlayNext-Setup.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: PlayNext ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/PlayNext-Setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/PlayNext-Setup.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
