name: Windows build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de release GitHub"
        required: true
        default: "v0.1.0"
  push:
    branches: [main, master]
    tags:
      - "v*"
    paths:
      - "apps/desktop/**"
      - "package-lock.json"
      - ".github/workflows/windows-build.yml"

jobs:
  build-windows:
    name: NSIS installer
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (NSIS)
        working-directory: apps/desktop
        run: npm run tauri:build

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "apps\desktop\src-tauri\target\release\bundle\nsis" `
            -Filter *.exe `
            | Select-Object -First 1
          if (-not $installer) { throw "Installeur NSIS introuvable" }
          Copy-Item $installer.FullName `
            "apps\desktop\src-tauri\target\release\bundle\nsis\PlayNext-Setup.exe" `
            -Force

      - name: Import Windows signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "playnext-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          "PLAYNEXT_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV

      - name: Sign Windows binaries
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            | Sort-Object LastWriteTime -Descending `
            | Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe introuvable" }
          $binaries = Get-ChildItem `
            "apps\desktop\src-tauri\target\release" `
            -Filter *.exe -Recurse
          foreach ($binary in $binaries) {
            & $signTool.FullName sign /fd SHA256 `
              /f $env:PLAYNEXT_CERTIFICATE_PATH `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 `
              $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature échouée: $($binary.FullName)" }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: playnext-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/PlayNext-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: PlayNext ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: apps/desktop/src-tauri/target/release/bundle/nsis/PlayNext-Setup.exe
